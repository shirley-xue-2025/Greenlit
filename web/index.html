<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greenlit — Replit approval</title>
<style>
  :root {
    --paper: #0D1F16;
    --card: #163426;
    --frame: #1D4231;
    --line: #21402F;
    --line-strong: #2A4E3C;
    --ink: #EAF3EC;
    --ink-2: #C3D9C8;
    --ink-3: #9BBBA5;
    --green-text: #9FDDB6;
    --pink-text: #F3AFD0;
    --amber-text: #E8C079;
    --link: #A7E3BF;
    --green-mark: #2E9E63;
    --pink-mark: #D45C96;
    --amber-mark: #D69A36;
    --mint: #1A3D2C;
    --mint-border: #2E5B42;
    --rose: #2A1D26;
    --rose-border: #4A2F40;
    --mint-row: #17372A;
    --rose-row: #291B25;
    --chip-bg: #234A37;
    --r-card: 16px;
    --r-pill: 99px;
    --r-chip: 7px;
    --font-display: Futura, "Avenir Next", sans-serif;
    --font-body: "Avenir Next", Avenir, -apple-system, sans-serif;
    --font-mono: "SF Mono", Menlo, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper);
    font-family: var(--font-body);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  h1, h2, h3, h4 { text-wrap: balance; }
  p, li { text-wrap: pretty; }
  button, textarea { font-family: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 32px 96px; }
  .mono { font-family: var(--font-mono); }

  .brand-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  h1 {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -.01em;
    color: var(--ink);
  }
  h1 i { font-style: normal; color: var(--pink-text); }
  .header-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }

  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 13px; border-radius: var(--r-pill);
    font-size: 12px; font-weight: 700; border: 1px solid var(--line-strong);
    background: var(--card); color: var(--ink-2); cursor: pointer;
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
  .pill.on { background: var(--card); color: var(--ink); border-color: var(--mint-border); }
  .pill.on .dot { background: var(--green-mark); }
  .pill.blocked { background: var(--card); color: var(--ink); border-color: var(--rose-border); cursor: default; }
  .pill.blocked .dot { background: var(--pink-mark); }
  .pill.signed { background: var(--card); color: var(--ink); border-color: var(--mint-border); cursor: default; }
  .pill.signed .dot { background: var(--green-mark); }
  .btn-reset {
    padding: 6px 13px; border-radius: var(--r-pill);
    font-size: 12px; font-weight: 700; cursor: pointer;
    background: transparent; color: var(--ink-2);
    border: 1px solid var(--line-strong);
  }
  .btn-reset:hover, .pill:hover { border-color: var(--mint-border); }
  .btn-reset:focus-visible, .pill:focus-visible, .btn-sign:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--green-text); outline-offset: 2px;
  }

  .queue { margin-top: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .queue-label {
    margin: 28px 0 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .queue-row {
    display: grid; grid-template-columns: 140px 100px 1fr;
    gap: 12px; padding: 12px 16px; align-items: center;
    border-bottom: 1px solid var(--line); font-size: 13.5px;
  }
  .queue-row:last-child { border-bottom: none; }
  .queue-row.current { box-shadow: inset 3px 0 0 var(--pink-mark); }
  .q-tool { font-weight: 700; color: var(--ink); }
  .q-meta { color: var(--ink); font-size: 12px; }

  .hero { margin-top: 20px; }
  .hero-top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .hero-tool {
    font-family: var(--font-display); font-size: 32px; font-weight: 600;
    letter-spacing: -.01em; color: var(--ink);
  }
  .hero-hint { margin-top: 8px; color: var(--ink); font-size: 14.5px; line-height: 1.6; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 12px; border-radius: var(--r-chip);
    font-size: 13px; font-weight: 600;
    color: var(--ink);
    background: var(--chip-bg);
    border: 1px solid var(--line-strong);
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .chip.inherited { border-color: var(--mint-border); }
  .chip.inherited .dot { background: var(--green-mark); }
  .chip.gap { border-color: var(--rose-border); }
  .chip.gap .dot { background: var(--pink-mark); }
  .chip.na { color: var(--ink-3); }
  .chip.na .dot { background: var(--ink-3); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px 0 0; }
  .stats.two { grid-template-columns: 1fr 1fr; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px 18px 16px 20px; }
  .stat.primary { box-shadow: inset 3px 0 0 var(--green-mark); }
  .stat.gaps { box-shadow: inset 3px 0 0 var(--pink-mark); }
  .stat-label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; margin-bottom: 6px; }
  .stat-value {
    font-family: var(--font-display); font-size: 32px; font-weight: 600;
    letter-spacing: -.01em; font-variant-numeric: tabular-nums; color: var(--ink);
  }
  .stat-hint { color: var(--ink); font-size: 12px; margin-top: 6px; line-height: 1.5; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); padding: 18px 20px; margin-top: 16px; }
  .card.challenger { border-color: var(--line); box-shadow: inset 3px 0 0 var(--pink-mark); }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 12px; }
  h2 { font-size: 15px; font-weight: 700; letter-spacing: -.01em; color: var(--ink); }
  .section-note { color: var(--ink-3); font-size: 12px; }
  .body { color: var(--ink); font-size: 14.5px; line-height: 1.6; }
  .muted { color: var(--ink-2); font-size: 13px; line-height: 1.6; }

  label.field { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; margin-bottom: 8px; }
  textarea {
    width: 100%; min-height: 72px; resize: vertical;
    background: var(--frame); color: var(--ink);
    border: 1px solid var(--line-strong); border-radius: 12px;
    padding: 12px; font-size: 14.5px; line-height: 1.5;
  }
  .sign-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 12px; }
  .btn-sign {
    padding: 8px 16px; border-radius: var(--r-pill);
    font-size: 13px; font-weight: 700; cursor: pointer;
    background: #17402E; color: var(--ink);
    border: 1px solid var(--mint-border);
  }
  .btn-sign:disabled {
    cursor: not-allowed;
    background: var(--frame);
    color: var(--ink-3);
    border-color: var(--line-strong);
    opacity: 1;
  }
  .sign-reason { color: var(--ink-2); font-size: 13px; line-height: 1.5; }
  .sign-error { color: var(--amber-text); font-size: 13px; }
  .version-line { margin-top: 12px; color: var(--ink-2); font-size: 12px; font-family: var(--font-mono); line-height: 1.6; }

  .slack-msg { padding: 12px; background: var(--frame); border-radius: 12px; border: 1px solid var(--line); }
  .slack-who { font-size: 13px; font-weight: 700; color: var(--ink); }
  .slack-meta { color: var(--ink-3); font-size: 12px; font-weight: 400; margin-left: 8px; }
  .slack-text { margin-top: 8px; color: var(--ink); font-size: 14.5px; line-height: 1.6; }

  .priors { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .prior-score { font-family: var(--font-mono); font-size: 12px; color: var(--green-text); }
  .prior-score.pending { color: var(--ink-3); }
  .prior-preview { margin-top: 8px; color: var(--ink-2); font-size: 12px; line-height: 1.55; }

  .agents { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .stance {
    display: inline-flex; align-items: center;
    padding: 4px 10px; border-radius: var(--r-pill);
    font-size: 11px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase;
    background: var(--chip-bg); color: var(--ink);
    border: 1px solid var(--line-strong);
  }
  .stance.recommend_with_gaps { border-color: var(--mint-border); }
  .stance.block_copy { border-color: var(--rose-border); }

  .graph-frame {
    width: 100%; min-height: 420px; height: 480px; border: 0;
    border-radius: 12px; background: var(--frame);
  }
  .graph-svg { width: 100%; height: auto; display: block; }
  .graph-caption { margin-top: 8px; color: var(--ink-2); font-size: 12px; line-height: 1.5; }

  .audit {
    position: sticky; bottom: 0; z-index: 20;
    background: var(--card); border-top: 1px solid var(--line-strong);
    padding: 12px 32px;
    display: flex; flex-wrap: wrap; gap: 8px 24px;
    font-size: 12px; color: var(--ink);
  }
  .audit strong {
    color: var(--ink-2); font-weight: 700; margin-right: 7px;
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  }
  .load-error { padding: 24px 32px; color: var(--amber-text); }

  @media (max-width: 760px) {
    .wrap { padding: 20px 18px 88px; }
    .stats, .priors, .agents { grid-template-columns: 1fr; }
    .queue-row { grid-template-columns: 1fr; gap: 4px; }
    .audit { padding: 12px 18px; }
  }
</style>
</head>
<body data-surface="dark">
<div id="app"><p class="load-error">Loading approval…</p></div>
<script>
const ui = {
  role: roleFromUrl(),
  rationale: "Replit privacy contract is on file.",
  error: "",
  justSigned: false
};
let state = null;

function roleFromUrl() {
  const raw = new URLSearchParams(location.search).get("role") || "Employee";
  const allowed = ["Employee", "Legal", "Security", "Procurement"];
  return allowed.find((role) => role.toLowerCase() === raw.toLowerCase()) || "Employee";
}

function setRole(role) {
  ui.role = role;
  const url = new URL(location.href);
  url.searchParams.set("role", role);
  history.replaceState(null, "", url.pathname + url.search);
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

function shortHash(hash) {
  const raw = String(hash || "");
  if (raw.length <= 20) return raw;
  return raw.slice(0, 19) + "…";
}

function statusLabel(status) {
  if (status === "blocked") return "not approved yet";
  if (status === "signed") return "approved";
  return status;
}

function chipKind(id, record) {
  if ((record.inherited || []).includes(id)) return "inherited";
  if ((record.gaps || []).includes(id)) return "gap";
  return "na";
}

function chipsHtml(record) {
  const labels = state.control_labels || {};
  const order = state.control_order || [];
  return order.map((id) => {
    const kind = chipKind(id, record);
    return `<span class="chip ${kind}"><span class="dot"></span>${esc(labels[id] || id)}</span>`;
  }).join("");
}

function stanceLabel(stance) {
  const map = {
    recommend_with_gaps: "Recommend: sign the privacy contract",
    block_copy: "Do not copy Notion"
  };
  return map[stance] || stance.replaceAll("_", " ");
}

function lastSigner(record) {
  const signs = record.human_signoffs || [];
  return signs.length ? signs[signs.length - 1] : null;
}

function isEmployee() {
  return ui.role === "Employee";
}

function heroHint(record) {
  const dpaDone = (record.inherited || []).includes("vendor_dpa_signed");
  if (ui.role === "Employee") {
    return dpaDone
      ? "Legal signed Replit's privacy contract. You still cannot use Replit until Security has proof they do not keep our code."
      : "You cannot use Replit yet. The usual checks (company login, internal use, no customer data in prompts) are already covered. Two Replit-specific things are still missing — Legal and Security own those, not you.";
  }
  if (ui.role === "Legal") {
    return dpaDone
      ? "Privacy contract is on file. Proof they do not keep our code is still missing. Replit is still not approved."
      : "You are Priya Chen, Legal. Shirley Xue asked to start a Replit approval. Your job is Replit's privacy contract — not whether they keep our code.";
  }
  if (ui.role === "Security") {
    return dpaDone
      ? "You are Jonas Weber, Security. Priya signed the privacy contract. Your gap is still open: proof Replit does not keep our code. A signature will not close it."
      : "You are Jonas Weber, Security. Shirley Xue asked to start a Replit approval. Your job is proof they do not keep our code — not the privacy contract.";
  }
  return dpaDone
    ? "Replit's privacy contract is on file. Proof they do not keep our code is still open — that is Security, not a copy-paste of another company's contract."
    : "No Replit privacy contract is on file. Cursor's contract does not transfer. You keep the vendor file; Legal signs tonight.";
}

function visibleEnvelopes() {
  const role = (ui.role || "").toLowerCase();
  const envelopes = state.envelopes || [];
  if (role === "employee") return [];
  return envelopes.filter((env) => {
    const name = String(env.agent || "").toLowerCase();
    return name === "challenger" || name === role;
  });
}

function nextStepHtml(record) {
  const dpaDone = (record.inherited || []).includes("vendor_dpa_signed");
  return `<section class="card">
      <div class="section-head">
        <h2>Your next step</h2>
        <span class="section-note">You asked. You do not sign.</span>
      </div>
      <p class="body">${dpaDone
        ? "You still cannot use Replit. Legal finished their piece. Wait for Security on proof they do not keep our code. Nothing for you to upload."
        : "You cannot use Replit yet. You do not need to upload files or sign anything. This request is with Legal and Security."}</p>
      <div class="priors" style="margin-top:14px">
        <div>
          <h2>${dpaDone ? "Legal · done" : "Waiting on Legal"}</h2>
          <p class="muted">${dpaDone ? "Replit's privacy contract is signed." : "A signed privacy contract with Replit."}</p>
        </div>
        <div>
          <h2>Waiting on Security</h2>
          <p class="muted">Proof Replit does not keep our code. You do not provide this.</p>
        </div>
      </div>
    </section>`;
}

function slackHtml() {
  const slack = state.slack || {};
  const msgs = slack.messages || [];
  const body = msgs.map((msg) => `
    <div class="slack-msg">
      <div class="slack-who">${esc(msg.user)} <span class="slack-meta">${esc(msg.role)} · ${esc((msg.ts || "").replace("T", " ").replace("Z", " UTC"))}</span></div>
      <p class="slack-text">${esc(msg.text)}</p>
    </div>`).join("");
  return body || `<p class="muted">No request text yet.</p>`;
}

function requesterLineHtml() {
  const slack = state.slack || {};
  const msg = (slack.messages || [])[0] || {};
  const name = msg.user || "Shirley Xue";
  const role = msg.role || "Product";
  return `<p class="body" style="margin-top:12px"><strong>${esc(name)}</strong> · ${esc(role)} asked to start this approval.</p>`;
}

function similarsHtml() {
  const memory = ui.role === "Security"
    ? {
      cursor: "Your Cursor thread, May. You required proof they do not keep our code. That promise is Anysphere's. It does not cover Replit.",
      notion: "Your Notion thread, June. You told Nina Berg Notion is not a coding tool. That privacy contract cannot prove Replit does not keep our code."
    }
    : {
      cursor: "Lena Hofmann's Slack thread, April–May. A month of terms pastes and a privacy-contract chase. You signed in Greenlit. That contract is with Anysphere — it does not cover Replit.",
      notion: "Nina Berg's Slack thread, May–June. Greenlit already had the Cursor record. She still had to paste Notion's terms. You signed. Do not copy this contract onto Replit."
    };
  const similars = state.similars || {};
  const priors = similars.priors || [];
  if (!priors.length) return `<p class="muted">No earlier approvals loaded.</p>`;
  return `<div class="priors">${priors.map((prior) => {
    const score = prior.score == null
      ? `<div class="prior-score pending">${esc(prior.note || "retrieval pending")}</div>`
      : `<div class="prior-score">Qdrant ${Number(prior.score).toFixed(3)}</div>`;
    const blurb = memory[prior.case_id] || prior.preview || "";
    const preview = blurb ? `<p class="prior-preview">${esc(blurb)}</p>` : "";
    return `<div>
      <div class="section-head">
        <h2>${esc(prior.tool)}</h2>
        <span class="pill signed"><span class="dot"></span>approved</span>
      </div>
      <p class="muted">${esc(prior.vendor)} · ${esc(prior.signed || "")} · ${ui.role === "Security" ? "you and Legal" : "you and Security"}</p>
      ${score}
      ${preview}
    </div>`;
  }).join("")}</div>`;
}

function agentsHtml() {
  const envelopes = visibleEnvelopes();
  if (!envelopes.length) return "";
  return `<div class="agents">${envelopes.map((env) => {
    const name = env.agent || env.role || "specialist";
    const stance = env.stance || "";
    const isChallenger = String(name).toLowerCase() === "challenger";
    const title = isChallenger ? "Do not copy" : (String(name).charAt(0).toUpperCase() + String(name).slice(1));
    return `<section class="card ${isChallenger ? "challenger" : ""}" style="margin-top:0">
      <div class="section-head">
        <h2>${esc(title)}</h2>
        <span class="stance ${esc(stance)}">${esc(stanceLabel(stance))}</span>
      </div>
      <p class="body">${esc(env.natural_language || "")}</p>
    </section>`;
  }).join("")}</div>`;
}

function graphSvg(record) {
  const signer = lastSigner(record);
  const dpaDone = (record.inherited || []).includes("vendor_dpa_signed");
  const replitCtrl = dpaDone ? "5 covered + privacy contract · code still open" : "5 covered · 2 still open";
  const replitWho = signer ? signer.signer : "waiting on Legal";
  const rows = [
    ["Cursor", "Anysphere", "all checks met", "Priya Chen, Legal", "signed"],
    ["Notion AI", "Notion Labs", "privacy contract on file · not a coding tool", "Priya Chen, Legal", "signed"],
    ["Replit", "Replit", replitCtrl, replitWho, record.status || "blocked"]
  ];
  const colX = [16, 220, 424, 668, 900];
  const labels = ["Tool", "Company", "Checks", "Who signed", "Decision"];
  let nodes = labels.map((lab, i) =>
    `<text x="${colX[i] + 90}" y="18" text-anchor="middle" fill="#9BBBA5" font-size="11" font-weight="700" letter-spacing="0.08em">${lab.toUpperCase()}</text>`
  ).join("");
  rows.forEach((cols, r) => {
    const y = 36 + r * 88;
    const blocked = cols[4] === "blocked";
    cols.forEach((text, c) => {
      const x = colX[c];
      const fill = blocked && c === 4 ? "#2A1D26" : (blocked ? "#1D4231" : "#1A3D2C");
      const stroke = blocked && c === 4 ? "#4A2F40" : "#2E5B42";
      const ink = blocked && c === 4 ? "#F3AFD0" : "#EAF3EC";
      nodes += `<rect x="${x}" y="${y}" width="180" height="56" rx="12" fill="${fill}" stroke="${stroke}"/>`;
      nodes += `<text x="${x + 90}" y="${y + 34}" text-anchor="middle" fill="${ink}" font-size="12" font-weight="700">${esc(text)}</text>`;
      if (c < 4) {
        nodes += `<text x="${x + 188}" y="${y + 36}" fill="#9BBBA5" font-size="14">→</text>`;
      }
    });
  });
  return `<svg class="graph-svg" viewBox="0 0 1100 300" role="img" aria-label="Tool to vendor to control to signer to decision. Cursor and Notion signed. Replit blocked.">${nodes}</svg>`;
}

function graphHtml(record) {
  const svg = graphSvg(record);
  const caption = `<p class="graph-caption">Who signed what. Similar is not the same company.</p>`;
  if (state.graph_html) {
    return `${svg}${caption}
      <iframe class="graph-frame" style="min-height:260px;height:300px" src="/graph.html" title="Who signed what"></iframe>`;
  }
  return `${svg}${caption}`;
}

function render() {
  const root = document.getElementById("app");
  if (!state || !state.record) {
    root.innerHTML = `<p class="load-error">${esc(ui.error || "No approval record yet.")}</p>`;
    return;
  }
  const rec = state.record;
  const inheritedN = (rec.inherited || []).length;
  const gapsN = (rec.gaps || []).length;
  const signer = lastSigner(rec);
  const employee = isEmployee();
  const legal = ui.role === "Legal";
  const security = ui.role === "Security";
  const canSign = legal;
  const statusClass = rec.status === "signed" ? "signed" : "blocked";
  const roleList = state.roles && state.roles.length
    ? state.roles
    : ["Employee", "Legal", "Security", "Procurement"];
  const roles = roleList.map((role) =>
    `<button type="button" class="pill ${ui.role === role ? "on" : ""}" data-role="${esc(role)}" aria-pressed="${ui.role === role}">
      <span class="dot"></span>${esc(role)}
    </button>`
  ).join("");
  const agentBlock = agentsHtml();
  const signReason = legal
    ? "Sign files the privacy contract only. Replit stays not approved until Security has evidence."
    : security
      ? "Jonas cannot close this with a signature. Proof they do not keep our code still needs evidence."
      : "Only Legal can file the privacy contract tonight.";

  root.innerHTML = `
    <div class="wrap">
      <header>
        <div class="brand-row">
          <h1>Green<i>lit</i></h1>
          <div class="header-actions">
            ${roles}
            <button type="button" class="btn-reset" id="btn-reset">Reset demo</button>
          </div>
        </div>
      </header>

      <section class="hero" aria-live="polite">
        <div class="hero-top">
          <div class="hero-tool">${esc(rec.tool)}</div>
          <span class="pill ${statusClass}"><span class="dot"></span>${esc(statusLabel(rec.status))}</span>
        </div>
        <p class="hero-hint">${esc(heroHint(rec))}</p>
        <div class="chips">${chipsHtml(rec)}</div>
        ${legal || security ? requesterLineHtml() : ""}
      </section>

      ${employee ? `<div class="stats two">
        <div class="stat primary">
          <div class="stat-label">Already covered</div>
          <div class="stat-value ok">${inheritedN}</div>
          <div class="stat-hint">Usual checks already covered. You don't re-explain these.</div>
        </div>
        <div class="stat gaps">
          <div class="stat-label">Still missing</div>
          <div class="stat-value warn">${gapsN}</div>
          <div class="stat-hint">Legal and Security own these. Not you.</div>
        </div>
      </div>` : ""}

      ${legal || security ? `<section class="card">
        <div class="section-head">
          <h2>Memory from earlier Slack threads</h2>
          <span class="section-note">${state.similars && state.similars.pending ? "Qdrant still loading" : "Qdrant: similar past approvals"}</span>
        </div>
        <p class="muted" style="margin-bottom:12px">${legal
          ? "A keyword search would treat these two privacy contracts as the same. They are not."
          : "A keyword search would treat Notion's privacy contract as proof Replit does not keep code. It does not."}</p>
        ${similarsHtml()}
      </section>` : ""}

      ${legal && agentBlock ? `<div class="section-head" style="margin-top:24px">
        <h2>What Legal should notice</h2>
        <span class="section-note">Recommendation: you can sign the privacy contract. The other card stops a bad copy.</span>
      </div>${agentBlock}` : ""}

      ${security && agentBlock ? `<div class="section-head" style="margin-top:24px">
        <h2>What Security should notice</h2>
        <span class="section-note">Recommendation: a signature will not close this. The other card stops a bad copy.</span>
      </div>${agentBlock}` : ""}

      ${employee ? nextStepHtml(rec) : `<section class="card">
        <div class="section-head">
          <h2>${legal ? "Priya Chen · Legal" : security ? "Jonas Weber · Security" : "Human sign-off"}</h2>
          <span class="section-note">${legal ? "No Reject on this desk. Sign files the privacy contract." : security ? "No signature closes this gap." : "This is not your signature tonight."}</span>
        </div>
        <p class="muted" style="margin-bottom:12px">${legal
          ? "Recommendation: sign Replit's privacy contract. That does not approve Replit for use. Proof they do not keep our code stays with Security (Jonas Weber)."
          : security
            ? "Do not sign. Your gap needs evidence that Replit does not keep our code. The privacy contract is Priya's."
            : "Do not sign. Legal files the privacy contract. You keep the vendor file."}</p>
        <label class="field" for="rationale">Reason · ${esc(ui.role)}</label>
        <textarea id="rationale" maxlength="500">${esc(ui.rationale)}</textarea>
        <div class="sign-row">
          <button type="button" class="btn-sign" id="btn-sign" ${canSign ? "" : "disabled"}>Sign</button>
          <span class="sign-reason">${esc(signReason)}</span>
        </div>
        ${ui.error ? `<p class="sign-error" style="margin-top:8px">${esc(ui.error)}</p>` : ""}
        ${ui.justSigned || signer ? `<p class="version-line">v${esc(rec.version)} · ${esc(shortHash(rec.content_hash))}${signer ? " · " + esc(signer.signer) : ""}</p>` : ""}
      </section>`}

      ${!employee && !legal && !security ? `<section class="card">
        <div class="section-head">
          <h2>Similar past approvals</h2>
          <span class="section-note">Qdrant: similar past approvals</span>
        </div>
        ${similarsHtml()}
      </section>` : ""}

      ${!legal && !security && agentBlock ? `<div class="section-head" style="margin-top:24px">
        <h2>Your recommendation, and a warning</h2>
        <span class="section-note">This role's job, plus do not copy the wrong contract</span>
      </div>${agentBlock}` : ""}

      ${employee ? "" : `<section class="card">
        <div class="section-head">
          <h2>Who signed what</h2>
          <span class="section-note">${state.graph_html ? "Cognee: who signed what" : "Who signed what"}</span>
        </div>
        ${graphHtml(rec)}
      </section>`}
    </div>
    ${employee ? "" : `<footer class="audit">
      <div><strong>Version</strong>${esc(rec.version)}</div>
      <div><strong>Fingerprint</strong><span class="mono" title="${esc(rec.content_hash)}">${esc(shortHash(rec.content_hash))}</span></div>
      <div><strong>Slack thread</strong>${esc(rec.source_thread_id)}</div>
      <div><strong>Signer</strong>${signer ? esc(signer.signer) : "none yet"}</div>
      <div><strong>Updated</strong>${esc(rec.updated_at || "")}</div>
    </footer>`}
  `;

  root.querySelectorAll("[data-role]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const box = document.getElementById("rationale");
      if (box) ui.rationale = box.value;
      setRole(btn.getAttribute("data-role"));
      ui.error = "";
      render();
    });
  });
  const box = document.getElementById("rationale");
  if (box) box.addEventListener("input", () => { ui.rationale = box.value; });
  const signBtn = document.getElementById("btn-sign");
  if (signBtn) signBtn.addEventListener("click", onSign);
  const resetBtn = document.getElementById("btn-reset");
  if (resetBtn) resetBtn.addEventListener("click", onReset);
}

async function parseJson(res) {
  const type = res.headers.get("content-type") || "";
  if (type.includes("application/json")) return res.json();
  return { detail: await res.text() };
}

async function load() {
  try {
    const res = await fetch("/api/state", { cache: "no-store" });
    state = await parseJson(res);
    ui.error = "";
    render();
  } catch (err) {
    ui.error = "Could not load approval state.";
    render();
  }
}

async function onSign() {
  const box = document.getElementById("rationale");
  if (box) ui.rationale = box.value;
  ui.error = "";
  try {
    const res = await fetch("/api/sign", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      cache: "no-store",
      body: JSON.stringify({ role: ui.role, rationale: ui.rationale })
    });
    const data = await parseJson(res);
    if (!res.ok) {
      const detail = data.detail;
      ui.error = typeof detail === "string" ? detail : "Sign was rejected.";
      render();
      return;
    }
    state = data;
    ui.justSigned = true;
    ui.error = "";
    render();
  } catch (err) {
    ui.error = "Sign request failed.";
    render();
  }
}

async function onReset() {
  ui.error = "";
  ui.justSigned = false;
  ui.rationale = "Replit privacy contract is on file.";
  try {
    const res = await fetch("/demo/reset", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      cache: "no-store",
      body: "{}"
    });
    state = await parseJson(res);
    render();
  } catch (err) {
    ui.error = "Reset failed.";
    render();
  }
}

load();
</script>
</body>
</html>
